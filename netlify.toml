# Netlify-konfiguration (ADR 0012). Hosting-valg = Netlify (self-host som exit).
#
# GDPR / EU-residens (SKAL-krav, jf. docs/gdpr/leverandoer-register.md):
#   Netlifys funktioner kører som standard i US East (Ohio, "cmh"). Next.js-funktioner
#   genereres på build-tid, så pr.-funktion `region` i denne fil gælder IKKE for dem —
#   funktions-regionen SKAL sættes projekt-bredt i Netlify-UI'et:
#     Project configuration > Build & deploy > Continuous deployment > Functions region
#       → EU (Frankfurt) "fra"   [self-serve på Pro/Enterprise]
#   TODO(mads): sæt Functions region = EU (Frankfurt) i Netlify-UI'et og bekræft i ADR 0012.
#   Bemærk: region-valg kræver mindst Pro-plan (Free = kun US-default).
#
# Secrets: runtime-env-variabler (DATABASE_URL, NEXT_PUBLIC_SUPABASE_*, SUPABASE_SERVICE_ROLE_KEY
#   m.fl. — se .env.example) sættes i Netlify > Environment variables, IKKE som GitHub-secrets.
#   Dette lukker den udskudte host-secret-store i ADR 0008.

[build]
  command = "npm run build"
  # Merge-økonomi (CLAUDE.md, stående ordre): hver merge til main udløser en
  # produktions-redeploy med fast kreditomkostning uanset PR-størrelse. Derfor er hele
  # faser hidtil samlet i ÉN PR — hvilket gør review og `git bisect` upraktisk.
  #
  # `ignore` angriber omkostningen direkte i stedet: en diff der KUN rører dokumentation,
  # tests, CI-config eller agent-config kan ikke ændre den deployede side, så den build
  # springes over og koster ingenting. Semantik: exit 0 = spring build over, exit != 0 = byg.
  # `git diff --quiet` returnerer 0 netop når der ingen ændringer er uden for de udeladte
  # stier. Er $CACHED_COMMIT_REF ikke sat (første build), fejler kommandoen og der bygges —
  # den sikre default er altid at bygge.
  #
  # TODO(mads): verificér på den første docs-only merge at Netlify faktisk rapporterer
  # "Build skipped" og ikke trækker kredit. Først derefter kan merge-økonomi-reglen løsnes.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)tests' ':(exclude).github' ':(exclude).claude' ':(exclude)*.md'"

[build.environment]
  # Matcher .nvmrc og package.json engines.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Officielt Next.js-runtime for Netlify (SSR + App Router). Installeret som devDependency.
[[plugins]]
  package = "@netlify/plugin-nextjs"
